<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — Engineer / VR Developer / YouTuber{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Nakaji Kohki">
  <meta name="theme-color" content="#F7F5F0">

  <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — Engineer / VR Developer / YouTuber{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | replace:'index.html','' }}">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="{{ site.title }}">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@nkjzm">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="{% if page.body_class %}{{ page.body_class }}{% endif %}">
  <div class="grain" aria-hidden="true"></div>

  <main class="page">
    {{ content }}
  </main>

  <footer class="foot">
    <div class="page foot__inner">
      <span class="foot__copy">© 2026 Nakaji Kohki</span>
      <nav class="foot__nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <span class="foot__sep">·</span>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <span class="foot__sep">·</span>
        <a href="https://github.com/nkjzm" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span class="foot__sep">·</span>
        <a href="https://nkjzm.jp" target="_blank" rel="noopener noreferrer">nkjzm.jp</a>
      </nav>
    </div>
  </footer>
</body>
</html>
